<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Authenticated Chat Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 28, 41, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --input-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            display: flex;
            overflow: hidden;
        }

        /* Sidebar / Auth Section */
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .auth-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .btn-secondary { 
            background: transparent; 
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover { 
            background: rgba(255, 255, 255, 0.05); 
        }

        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }

        /* Connection status panel */
        .status-panel {
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger); /* default disconnected */
            box-shadow: 0 0 8px var(--danger);
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.75rem;
            margin-top: 4px;
            word-break: break-word;
        }

        .token-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Chat Window */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.05);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.1);
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .room-join-panel {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .room-join-panel input {
            width: 140px;
            padding: 6px 12px;
        }

        .messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.self {
            align-self: flex-end;
        }

        .message.other {
            align-self: flex-start;
        }

        .message-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            gap: 8px;
        }

        .message.self .message-meta {
            justify-content: flex-end;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.self .message-bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.other .message-bubble {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .system-message {
            align-self: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .system-message.join::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .system-message.leave::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--warning);
        }

        /* Message Input Area */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.15);
        }

        .input-area input {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Sidebar containing authentication controls -->
        <div class="sidebar">
            <div>
                <h3 class="section-title">Identity & Auth</h3>
                <div class="auth-box">
                    <div class="form-group">
                        <label for="usernameInput">Username</label>
                        <input type="text" id="usernameInput" placeholder="alice, bob">
                    </div>
                    <div class="form-group">
                        <label for="passwordInput">Password</label>
                        <input type="password" id="passwordInput" placeholder="password">
                    </div>
                    <div class="btn-group">
                        <button id="registerBtn" class="btn btn-secondary">Register</button>
                        <button id="loginBtn" class="btn btn-primary">Login</button>
                    </div>
                </div>
            </div>

            <!-- Connection Actions -->
            <div>
                <h3 class="section-title">Gateway Connection</h3>
                <div class="auth-box">
                    <button id="connectBtn" class="btn btn-primary" style="width: 100%;">Connect Socket</button>
                    <button id="disconnectBtn" class="btn btn-danger" style="width: 100%;">Disconnect</button>
                </div>
            </div>

            <!-- Status Indicator -->
            <div class="status-panel">
                <div class="status-header">
                    <div id="statusDot" class="status-dot"></div>
                    <div id="statusText" class="status-text">Disconnected</div>
                </div>
                <div id="tokenInfo" class="token-info">No JWT token saved</div>
                <div id="errorDisplay" class="error-msg" style="display: none;"></div>
            </div>
        </div>

        <!-- Main chat window -->
        <div class="chat-main">
            <!-- Header for Room joins -->
            <div class="chat-header">
                <h2 id="roomTitle">Not connected</h2>
                <div class="room-join-panel">
                    <input type="text" id="roomInput" placeholder="Room name" value="general" disabled>
                    <button id="joinBtn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" disabled>Join</button>
                </div>
            </div>

            <!-- Message log -->
            <div id="messagesArea" class="messages-area">
                <div class="system-message">Please register/login and connect socket to start.</div>
            </div>

            <!-- Message inputs -->
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type message..." disabled>
                <button id="sendBtn" class="btn btn-primary" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- Socket.IO Client CDN -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const registerBtn = document.getElementById('registerBtn');
        const loginBtn = document.getElementById('loginBtn');
        
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const tokenInfo = document.getElementById('tokenInfo');
        const errorDisplay = document.getElementById('errorDisplay');

        const roomTitle = document.getElementById('roomTitle');
        const roomInput = document.getElementById('roomInput');
        const joinBtn = document.getElementById('joinBtn');
        
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        let socket = null;
        let savedToken = '';
        let currentRoom = '';
        let currentUser = '';

        // API Helpers
        async function makeAuthRequest(endpoint, username, password) {
            errorDisplay.style.display = 'none';
            try {
                const res = await fetch(`http://localhost:3000/auth/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.message || `HTTP ${res.status}`);
                }
                
                savedToken = data.access_token;
                currentUser = username;
                tokenInfo.textContent = `JWT: ${savedToken.slice(0, 15)}...`;
                tokenInfo.style.color = 'var(--success)';
                
                // Trigger auto-connect
                connectSocket();
            } catch (err) {
                tokenInfo.textContent = 'Auth failed';
                tokenInfo.style.color = 'var(--danger)';
                errorDisplay.textContent = err.message;
                errorDisplay.style.display = 'block';
            }
        }

        // Action listeners
        registerBtn.addEventListener('click', () => {
            const u = usernameInput.value.trim();
            const p = passwordInput.value.trim();
            if (!u || !p) return alert('Username/password missing');
            makeAuthRequest('signup', u, p);
        });

        loginBtn.addEventListener('click', () => {
            const u = usernameInput.value.trim();
            const p = passwordInput.value.trim();
            if (!u || !p) return alert('Username/password missing');
            makeAuthRequest('login', u, p);
        });

        connectBtn.addEventListener('click', () => {
            connectSocket();
        });

        disconnectBtn.addEventListener('click', () => {
            if (socket) {
                socket.disconnect();
            }
        });

        // Socket logic
        function connectSocket() {
            errorDisplay.style.display = 'none';
            if (socket) {
                socket.disconnect();
            }

            // Connection options: send token via auth payload
            socket = io('http://localhost:3000', {
                auth: { token: savedToken }
            });

            socket.on('connect', () => {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
                statusText.style.color = 'var(--success)';
                roomTitle.textContent = `Authenticated as: ${currentUser}`;
                
                roomInput.disabled = false;
                joinBtn.disabled = false;
                
                messagesArea.innerHTML = '<div class="system-message">Socket connected. Ready to join a room.</div>';
            });

            socket.on('connect_error', (err) => {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Error';
                statusText.style.color = 'var(--danger)';
                
                errorDisplay.textContent = `Connection Rejected: ${err.message}`;
                errorDisplay.style.display = 'block';
                roomTitle.textContent = 'Connection Rejected';
            });

            socket.on('authError', (data) => {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Rejected';
                statusText.style.color = 'var(--danger)';
                
                errorDisplay.textContent = data.message;
                errorDisplay.style.display = 'block';
                roomTitle.textContent = 'Auth Failed';
            });

            socket.on('disconnect', () => {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Disconnected';
                statusText.style.color = 'var(--danger)';
                roomTitle.textContent = 'Not connected';
                
                roomInput.disabled = true;
                joinBtn.disabled = true;
                messageInput.disabled = true;
                sendBtn.disabled = true;
                
                appendSystemMessage('Socket disconnected.', 'leave');
            });

            socket.on('roomToClient', (data) => {
                if (data.kind === 'join') {
                    appendSystemMessage(`${data.nickname} joined the room.`, 'join');
                } else if (data.kind === 'leave') {
                    appendSystemMessage(`${data.nickname} left the room.`, 'leave');
                }
            });

            socket.on('chatToClient', (msg) => {
                appendChatMessage(msg);
            });
        }

        function joinRoom() {
            const room = roomInput.value.trim();
            if (!room || !socket) return;
            currentRoom = room;
            
            socket.emit('joinRoom', { room: currentRoom });
            roomTitle.textContent = `Room: ${currentRoom} (${currentUser})`;
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
            
            messagesArea.innerHTML = '';
            appendSystemMessage(`Joined room: ${currentRoom}`, 'join');
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !socket) return;
            
            socket.emit('chatToServer', { text });
            messageInput.value = '';
            messageInput.focus();
        }

        // UI Helpers
        function appendSystemMessage(text, kind) {
            const div = document.createElement('div');
            div.className = `system-message ${kind}`;
            div.textContent = text;
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function appendChatMessage(msg) {
            const isSelf = msg.nickname === currentUser;
            const div = document.createElement('div');
            div.className = `message ${isSelf ? 'self' : 'other'}`;

            const meta = document.createElement('div');
            meta.className = 'message-meta';
            const timeStr = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            meta.textContent = `${msg.nickname} • ${timeStr}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = msg.text;

            div.appendChild(meta);
            div.appendChild(bubble);
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        joinBtn.addEventListener('click', joinRoom);
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
